tags:
  - Categories
summary: List redaction categories
description: Requires the browser session or a valid X-API-Key header (server-to-server).
security:
  - ApiKeyAuth: []
produces:
  - application/json
responses:
  200:
    description: Array of category names
    schema:
      type: array
      items: {type: string}
  401:
    description: Invalid API key
    schema:
      type: object
      properties:
        error: {type: string}
  403:
    description: Not authorized — no session uid and no API key
    schema:
      type: object
      properties:
        error: {type: string}
