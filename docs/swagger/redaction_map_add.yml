tags:
  - Redaction Map
summary: Manually add a missed value to the redaction map
description: >
  Masks an additional value in an already-redacted file and records it as a
  manual redaction row. Requires the browser session or a valid X-API-Key
  header (server-to-server).
security:
  - ApiKeyAuth: []
consumes:
  - application/json
produces:
  - application/json
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required: [file_id, source_text, category]
      properties:
        file_id: {type: string}
        source_text: {type: string}
        category: {type: string}
responses:
  200:
    description: Updated rows and preview
    schema:
      type: object
      properties:
        rows:
          type: array
          items: {type: object}
        preview: {type: object}
        redacted_filename: {type: string}
  400:
    description: Missing fields, or value not found in the document
    schema:
      type: object
      properties:
        error: {type: string}
  401:
    description: Invalid API key
    schema:
      type: object
      properties:
        error: {type: string}
  403:
    description: Not authorized — no session uid and no API key
    schema:
      type: object
      properties:
        error: {type: string}
  404:
    description: Unknown file_id or redacted output not found on disk
    schema:
      type: object
      properties:
        error: {type: string}
  409:
    description: Value already masked
    schema:
      type: object
      properties:
        error: {type: string}
  500:
    description: Masking failed
    schema:
      type: object
      properties:
        error: {type: string}
