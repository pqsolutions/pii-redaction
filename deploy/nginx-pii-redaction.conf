# /etc/nginx/conf.d/pii-redaction.conf
server {
    listen 80;
    server_name _;                 # replace with your domain / EC2 public DNS

    client_max_body_size 210m;     # app allows 200 MB uploads

    location / {
        proxy_pass http://127.0.0.1:5009;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline runs are long (waitress channel_timeout = 2h)
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;

        # Server-Sent Events (/stream/<job_id>) must not be buffered
        proxy_buffering off;
        proxy_cache off;
    }
}
