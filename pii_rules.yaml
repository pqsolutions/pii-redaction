GLOBAL_RULES: |
  - Never redact government bodies (ATO, ASIC, Medicare, Centrelink, Services Australia).
  - Never redact standard form labels or headings (Date:, Total:, Signature:, Employer's name, Your client, Tax return Individuals, Income Tax).
  - Never redact generic dates (financial year, statement period).
  - Never redact $0.00 zero dollar amounts.
  - If in doubt, REDACT. Over-redacting wastes a minute, under-redacting is a data breach.

PERSON_RULES: |
  - REDACT full names (First + Last, including preferred or previous names).
  - REDACT names of spouses, dependents, next of kin, and power of attorney.
  - SKIP single generic given names (e.g., "Michael") unless the context strongly implies a specific client.
  - SKIP historical figures, author credits, or public officer titles.

ORGANIZATION_RULES: |
  - SKIP ASX-listed public companies (e.g., Commonwealth Bank, NAB) UNLESS they are paired with a specific personal account number.
  - REDACT proprietary private companies (Pty Ltd) or Trust names if linked to an individual (e.g., as settlor, trustee, or employee).
  - REDACT employer names or health funds ONLY IF they appear next to an individual's job title, workplace address, or member number.

FINANCIAL_RULES: |
  - DO NOT redact any financial status or financial amounts.
  - SKIP all generic amounts, general transaction amounts, price tags, public tender amounts, or zero balances ($0.00).

ALLOWLIST:
  - "Australian Taxation Office"
  - "ATO"
  - "ASIC"
  - "Services Australia"
  - "Medicare"
  - "Employer's name"
