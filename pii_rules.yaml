TIER_1_REGEX:
  CREDIT_CARD: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|6(?:011|5[0-9]{2})[0-9]{12}|(?:2131|1800|35\d{3})\d{11})\b'
  TFN: '\b\d{3}[ -]?\d{3}[ -]?\d{3}\b'
  ABN: '\b\d{2}[ -]?\d{3}[ -]?\d{3}[ -]?\d{3}\b'
  EMAIL: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
  PHONE: '\b(?:\+?61|0)[2-478](?:[ -]?[0-9]){8}\b'
  MEDICARE: '\b\d{4}\s?\d{5}\s?\d{1}(?:\s?\d{1})?\b'
  BSB_ACCOUNT: '\b\d{3}[-\s]\d{3}\s+\d{6,10}\b'
  ACCOUNT_NUMBER: '(?:Account)\s*(?:Number|No\.?|#)\s*[:#]?\s*\d{6,10}\b'
  REF_NUMBER: '(?:Client\s*(?:Reference|Ref)(?:\s*(?:Number|No\.?))?|Agent\s*(?:Reference|Ref)(?:\s*(?:Number|No\.?))?|Reference\s*(?:Number|No\.?)|Transaction\s*(?:ID|Reference|Number|No\.?)|Invoice\s*(?:ID|Number|No\.?)|Investment\s*(?:Reference|Ref)(?:\s*(?:Number|No\.?))?|Policy\s*(?:Number|No\.?))\s*[:#.\s]?\s*[\w\-]*\d[\w\-]*(?:\s+[\w\-]{1,10}){0,3}'
